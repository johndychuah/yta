<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03101c"/>
      <stop offset="0.7" stop-color="#0c2846"/>
      <stop offset="1" stop-color="#123457"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.45">
      <stop offset="0" stop-color="#ffad50" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffad50" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4166"/>
      <stop offset="0.55" stop-color="#2a5885"/>
      <stop offset="1" stop-color="#173452"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2340"/>
      <stop offset="1" stop-color="#03101c"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <pattern id="win" width="14" height="18" patternUnits="userSpaceOnUse">
      <rect x="4" y="5" width="5" height="7" fill="#ffad50" fill-opacity="0.32"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="600" fill="url(#sky)"/>
  <rect width="1440" height="600" fill="url(#dots)"/>
  <rect width="1440" height="600" fill="url(#glow)"/>
  <rect y="528" width="1440" height="72" fill="url(#water)"/>
  <rect y="526" width="1440" height="2.4" fill="#ffad50" fill-opacity="0.4"/>

  <g transform="translate(144 4) scale(0.8)">

  <!-- Trade routes -->
  <path d="M212 196 Q700 -60 1132 166" fill="none" stroke="#ffad50" stroke-width="3" stroke-dasharray="10 10" stroke-linecap="round"/>
  <path d="M260 300 Q720 120 1180 290" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="4 10" stroke-linecap="round"/>
  <path d="M330 380 Q720 250 1260 360" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="4 10" stroke-linecap="round"/>
  <circle cx="212" cy="196" r="14" fill="#ffad50" fill-opacity="0.45" filter="url(#soft)"/>
  <circle cx="212" cy="196" r="6" fill="#ffad50"/>
  <circle cx="1132" cy="166" r="14" fill="#ffad50" fill-opacity="0.45" filter="url(#soft)"/>
  <circle cx="1132" cy="166" r="6" fill="#ffad50"/>
  <!-- Plane on the route -->
  <g transform="translate(676 66) rotate(4)">
    <path d="M-22 0 L18 -3 Q26 0 18 3 Z" fill="#ffffff"/>
    <path d="M-2 -1 L-12 -16 L-6 -16 L8 -1 Z M-2 1 L-12 16 L-6 16 L8 1 Z" fill="#ffffff"/>
    <path d="M-18 0 L-24 -8 L-20 -8 L-14 0 Z" fill="#ffffff"/>
  </g>

  <!-- Shanghai skyline -->
  <g>
    <rect x="30" y="520" width="60" height="140" fill="#163352"/>
    <rect x="30" y="520" width="60" height="140" fill="url(#win)"/>
    <rect x="95" y="470" width="48" height="190" fill="#1a3a5c"/>
    <rect x="95" y="470" width="48" height="190" fill="url(#win)"/>
    <rect x="245" y="500" width="40" height="160" fill="#163352"/>
    <rect x="245" y="500" width="40" height="160" fill="url(#win)"/>
    <rect x="420" y="540" width="44" height="120" fill="#163352"/>
    <rect x="420" y="540" width="44" height="120" fill="url(#win)"/>
    <rect x="520" y="560" width="56" height="100" fill="#163352"/>
    <rect x="520" y="560" width="56" height="100" fill="url(#win)"/>

    <!-- Oriental Pearl Tower -->
    <path d="M182 660 L200 560 L206 560 L188 660 Z M238 660 L220 560 L214 560 L232 660 Z" fill="url(#tower)"/>
    <rect x="204" y="250" width="12" height="410" fill="url(#tower)"/>
    <circle cx="210" cy="530" r="40" fill="url(#tower)"/>
    <circle cx="210" cy="530" r="40" fill="none" stroke="#ffad50" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="210" cy="380" r="27" fill="url(#tower)"/>
    <circle cx="210" cy="380" r="27" fill="none" stroke="#ffad50" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="210" cy="292" r="11" fill="url(#tower)"/>
    <rect x="208" y="196" width="4" height="60" fill="#2a5885"/>

    <!-- Shanghai World Financial Center -->
    <path d="M292 660 L302 250 L346 250 L356 660 Z" fill="url(#tower)"/>
    <path d="M310 262 L338 262 L336 286 L312 286 Z" fill="#0c2846"/>

    <!-- Shanghai Tower -->
    <path d="M368 660 L374 330 Q382 220 396 182 L420 188 Q424 280 432 330 L440 660 Z" fill="url(#tower)"/>
    <path d="M378 640 Q392 420 404 186" fill="none" stroke="#ffad50" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Jin Mao Tower -->
    <rect x="466" y="400" width="44" height="260" fill="url(#tower)"/>
    <rect x="471" y="350" width="34" height="50" fill="url(#tower)"/>
    <rect x="476" y="310" width="24" height="40" fill="url(#tower)"/>
    <rect x="481" y="280" width="14" height="30" fill="url(#tower)"/>
    <rect x="486" y="236" width="4" height="44" fill="#2a5885"/>
  </g>

  <!-- Kuala Lumpur skyline -->
  <g>
    <rect x="880" y="540" width="50" height="120" fill="#163352"/>
    <rect x="880" y="540" width="50" height="120" fill="url(#win)"/>
    <rect x="995" y="500" width="44" height="160" fill="#1a3a5c"/>
    <rect x="995" y="500" width="44" height="160" fill="url(#win)"/>
    <rect x="1225" y="480" width="44" height="180" fill="#163352"/>
    <rect x="1225" y="480" width="44" height="180" fill="url(#win)"/>
    <rect x="1345" y="520" width="70" height="140" fill="#1a3a5c"/>
    <rect x="1345" y="520" width="70" height="140" fill="url(#win)"/>

    <!-- KL Tower -->
    <rect x="957" y="330" width="10" height="330" fill="url(#tower)"/>
    <path d="M930 322 Q962 296 994 322 L986 338 Q962 350 938 338 Z" fill="url(#tower)"/>
    <path d="M938 338 Q962 350 986 338" fill="none" stroke="#ffad50" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="960" y="210" width="4" height="96" fill="#2a5885"/>

    <!-- Petronas Twin Towers -->
    <g id="petronas">
      <rect x="1062" y="330" width="50" height="330" fill="url(#tower)"/>
      <rect x="1067" y="290" width="40" height="40" fill="url(#tower)"/>
      <rect x="1072" y="260" width="30" height="30" fill="url(#tower)"/>
      <rect x="1077" y="236" width="20" height="24" fill="url(#tower)"/>
      <rect x="1085" y="166" width="4" height="72" fill="#2a5885"/>
      <path d="M1074 650 L1074 340 M1087 650 L1087 300 M1100 650 L1100 340" stroke="#ffad50" stroke-opacity="0.22" stroke-width="2"/>
    </g>
    <use href="#petronas" x="96"/>
    <rect x="1112" y="430" width="46" height="8" fill="#2a5885"/>
    <path d="M1112 470 L1135 438 L1158 470" fill="none" stroke="#2a5885" stroke-width="3"/>

    <!-- Merdeka 118 -->
    <path d="M1282 660 L1290 280 L1312 216 L1334 280 L1342 660 Z" fill="url(#tower)"/>
    <path d="M1312 216 L1312 660" stroke="#ffad50" stroke-opacity="0.22" stroke-width="2"/>
    <rect x="1310" y="130" width="4" height="90" fill="#2a5885"/>
  </g>

  <!-- Waterfront -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" stroke-linecap="round">
    <path d="M180 690 H260 M330 706 H420 M470 690 H520"/>
    <path d="M940 690 H990 M1060 706 H1210 M1290 690 H1340"/>
  </g>

  <!-- City labels -->
  <g font-family="Inter, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#ffffff" font-weight="600" letter-spacing="3">
    <text x="300" y="718" text-anchor="middle" font-size="30" fill-opacity="0.85">SHANGHAI · 上海</text>
    <text x="1140" y="718" text-anchor="middle" font-size="30" fill-opacity="0.85">KUALA LUMPUR · 吉隆坡</text>
  </g>
  </g>
</svg>
