<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" preserveAspectRatio="none">
  <defs>
    <filter id="soft-cloud" x="-30%" y="-60%" width="160%" height="220%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".009 .018" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="65" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <g fill="white" filter="url(#soft-cloud)">
    <g opacity=".8">
      <ellipse cx="350" cy="130" rx="180" ry="35"/>
      <ellipse cx="295" cy="100" rx="80" ry="42"/>
      <ellipse cx="400" cy="98" rx="100" ry="50"/>
      <ellipse cx="485" cy="135" rx="85" ry="28"/>
    </g>
    <g opacity=".65">
      <ellipse cx="1110" cy="260" rx="250" ry="45"/>
      <ellipse cx="1025" cy="228" rx="100" ry="50"/>
      <ellipse cx="1150" cy="208" rx="115" ry="70"/>
      <ellipse cx="1260" cy="250" rx="90" ry="37"/>
    </g>
    <ellipse cx="755" cy="65" rx="180" ry="18" opacity=".35"/>
  </g>
</svg>
